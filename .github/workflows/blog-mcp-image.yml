name: blog-mcp Image

# Builds, smoke-tests and publishes the blog-mcp MCP server's Docker image
# (tools/blog-mcp/Dockerfile) to ghcr.io, and redeploys the stack. The image
# build, smoke test, push and deploy are the shared reusable container
# workflow (The-Running-Dev/GitHub-ActionTemplates, container.yml); this file
# keeps only what is specific to this repository: the change-area gating, the
# test job and the Compose validation. It is intentionally its own file, never
# a job added to docs.yml, which is only the thin caller of the shared
# reusable docs workflow and carries nothing else.
#
# Not a required status check (main requires only `docs / Build`), so it's
# free to be more aggressively gated than the docs workflows: a `changes` job
# (build/WorkflowChangeAreas.psm1, Milestone 10 Phase A, driven by
# build/Write-BlogMcpChangeAreaOutput.ps1) classifies every run into
# blog_mcp_test/blog_mcp_image/blog_mcp_compose, and every other job below
# gates on those outputs. The `paths:` filter on `on:` is belt-and-braces with
# that classifier, not redundant with it: `paths:` stops a run from being
# created at all (the property that makes "a planning-document change creates
# no workflow run" true), while the classifier splits jobs *within* a created
# run (the property that makes "a test-only change never builds or publishes
# an image" true). Losing either one reopens a real, previously observed
# failure mode: PR #83 changed only two Markdown files under tools/blog-mcp/
# and still ran the full package suite and a Docker build twice, then on merge
# published `latest` and called the Portainer redeploy webhook.

"on":
    push:
        branches:
            - main
        paths: &blog-mcp-path
            # blog_mcp_image inputs
            - "tools/blog-mcp/Dockerfile"
            - "tools/blog-mcp/.dockerignore"
            - "tools/blog-mcp/docker-entrypoint.sh"
            - "tools/blog-mcp/package.json"
            - "tools/blog-mcp/package-lock.json"
            - "tools/blog-mcp/tsconfig.json"
            - "tools/blog-mcp/src/**"
            - "tools/blog-mcp/ui/package.json"
            - "tools/blog-mcp/ui/package-lock.json"
            - "tools/blog-mcp/ui/tsconfig*.json"
            - "tools/blog-mcp/ui/vite.config.ts"
            - "tools/blog-mcp/ui/index.html"
            - "tools/blog-mcp/ui/public/**"
            - "tools/blog-mcp/ui/src/**"
            # blog_mcp_test-only inputs
            - "tools/blog-mcp/test/**"
            - "tools/blog-mcp/vitest.config.*"
            # blog_mcp_compose inputs
            - "docker-compose.yml"
            - "tools/blog-mcp/docker-compose.yml"
            - "tools/blog-mcp/.env.example"
            - "tools/blog-mcp/.env.ci"
            # the classifier and this workflow's own definition
            - "build/WorkflowChangeAreas.psm1"
            - "build/Get-WorkflowChangeArea.ps1"
            - "build/Write-BlogMcpChangeAreaOutput.ps1"
            - "build/Test-WorkflowChangeAreas.ps1"
            - "build/Test-BlogMcpImageContract.ps1"
            - "build/Confirm-BlogMcpDeployment.ps1"
            - "build/Invoke-BlogMcpPostDeploy.ps1"
            - ".github/workflows/blog-mcp-image.yml"
    pull_request:
        paths: *blog-mcp-path
    workflow_dispatch:
        inputs:
            redeploy:
                description: "Also call the stack redeploy webhook (main only)."
                type: boolean
                default: true

# Every job declares its own permissions; nothing is granted by default.
permissions: {}

# Scoped so that only pull-request runs cancel their own stale predecessors.
# Deliberately NOT a blanket cancel-in-progress: true -- that would apply to
# the publish and deploy jobs too, and this repository's stated CI audit
# requires production publishing to stay serialized until it's proven that
# cancelling or superseding a run can't let an older image redeploy after a
# newer one.
#
# github.event_name is part of the group key so a main push can never share a
# group with (and therefore never be cancelled by) a pull-request run. For
# push and workflow_dispatch, cancel-in-progress is false, so concurrent runs
# queue instead: an in-flight publish always finishes, and if a third merge
# lands while a second is still queued, the third cancels the pending second
# and takes its place -- so the newest merge is always what ends up
# published, without ever cancelling an in-flight one.
concurrency:
    group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    changes:
        name: Classify change areas
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            blog_mcp_test: ${{ steps.classify.outputs.blog_mcp_test }}
            blog_mcp_image: ${{ steps.classify.outputs.blog_mcp_image }}
            blog_mcp_compose: ${{ steps.classify.outputs.blog_mcp_compose }}
            forced: ${{ steps.classify.outputs.forced }}
        steps:
            # fetch-depth: 0 -- Get-WorkflowChangePath computes
            # `git merge-base` between the base ref and HEAD, and a shallow
            # single-ref checkout (actions/checkout's fetch-depth: 1 default)
            # has neither the base commit nor any common ancestor, so the
            # classifier throws its "fetch full history" error and this job
            # fails closed. This also creates the origin/* tracking refs a
            # pull_request's base ref resolves through.
            - name: Check out repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            # Every dynamic value arrives through env:, never interpolated
            # into a script body -- github.base_ref is attacker-influenced on
            # a fork PR, and `${{ }}` inside a run: block is textual
            # substitution before PowerShell ever parses the script. The
            # classification itself (base-ref resolution, the
            # workflow_dispatch force, the job outputs and the summary) is in
            # the script.
            - name: Classify changed paths
              id: classify
              shell: pwsh
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  PR_BASE_REF: ${{ github.base_ref }}
                  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  PUSH_BEFORE: ${{ github.event.before }}
              run: ./build/Write-BlogMcpChangeAreaOutput.ps1

    test:
        name: Test blog-mcp
        needs: changes
        if: needs.changes.outputs.blog_mcp_test == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        defaults:
            run:
                working-directory: tools/blog-mcp
        steps:
            # fetch-depth: 0 (full history), not the actions/checkout default
            # shallow fetch-depth: 1 -- blog_log defaults to `git log
            # origin/<base>`, not HEAD (a long-lived container's checkout may
            # be parked on a stale branch, so history should reflect what's
            # actually published). A shallow, single-ref checkout never
            # creates an origin/main tracking ref at all, which made
            # test/serve.test.ts's "GET /api/log" test fail here the first
            # time this suite ever ran in real CI -- every local dev clone
            # already has full history, so nothing surfaced this before.
            - name: Check out repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Set up Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: |
                      tools/blog-mcp/package-lock.json
                      tools/blog-mcp/ui/package-lock.json

            - name: Install server dependencies
              run: npm ci

            - name: Install admin UI dependencies
              run: npm ci
              working-directory: tools/blog-mcp/ui

            # verification: true
            - name: Build server (tsc)
              run: npm run build

            # npm test's own pretest hook builds the UI (npm run build:ui) --
            # see tools/blog-mcp/package.json.
            # verification: true
            - name: Run test suite
              run: npm test

            # Both gates below run from the repository root, overriding this
            # job's tools/blog-mcp working-directory default -- their paths
            # are repo-relative and both self-locate their own repository
            # root regardless, but running them from the root keeps that
            # explicit rather than relying on the self-location fallback.
            # pwsh is preinstalled on ubuntu-latest.
            # verification: true
            - name: Run change-area classifier fixtures
              run: pwsh -NoProfile -File ./build/Test-WorkflowChangeAreas.ps1
              working-directory: ${{ github.workspace }}

            # verification: true
            - name: Verify image contract (Dockerfile / .dockerignore / classifier parity)
              run: pwsh -NoProfile -File ./build/Test-BlogMcpImageContract.ps1
              working-directory: ${{ github.workspace }}

    # Build, smoke test, push and redeploy, all in the shared container
    # workflow. Its checks are `image / Build`, `image / Publish`,
    # `image / Deploy` and `image / Result`; they replace the old
    # `Verify image build (pull request)` and `Publish image (ghcr.io)` jobs
    # (neither was a required check).
    #
    # Runs only when the image inputs changed (blog_mcp_image), which
    # structurally implies blog_mcp_test -- so `test` has run, and plain
    # `needs` semantics mean the image is built only after the applicable
    # tests pass. A manual dispatch forces every area true.
    #
    # What happens per event is decided inside container.yml: a pull request
    # builds and smoke-tests the image and pushes nothing; a push to main
    # also publishes `latest` and `<short-sha>`; a manual run on another
    # branch only builds and smoke-tests.
    image:
        needs: [changes, test]
        if: needs.changes.outputs.blog_mcp_image == 'true'
        permissions:
            contents: read
            packages: write
            id-token: write
            attestations: write
        uses: The-Running-Dev/GitHub-ActionTemplates/.github/workflows/container.yml@v1
        with:
            context: tools/blog-mcp
            # GHCR image paths must be lowercase: the package is
            # ghcr.io/the-running-dev/subzerodev-blog-mcp.
            image-name: subzerodev-blog-mcp
            tags: short-sha latest
            # The full source commit SHA, baked into the image as
            # BLOG_MCP_BUILD_REVISION (see the Dockerfile) and surfaced at
            # runtime by src/runtimeInfo.ts through /healthz and
            # blog_repo_status -- this is what the deploy health check and
            # build/Confirm-BlogMcpDeployment.ps1 poll the public endpoint for.
            # build/Test-BlogMcpImageContract.ps1 asserts this line.
            build-args: |
                BLOG_MCP_BUILD_REVISION=${{ github.sha }}
            # The image is started in its `serve` mode (what the deployment
            # Compose file runs) and /healthz must answer before anything is
            # pushed. serve clones BLOG_MCP_CLONE_URL at start, so the public
            # repository is cloned; the identity and token are throwaway
            # fixture values, not secrets. The 0.0.0.0 host is required for
            # the published port to be reachable.
            smoke-port: "8765"
            smoke-path: /healthz
            smoke-timeout: "120"
            smoke-env: |
                BLOG_MCP_TRANSPORT=serve
                BLOG_MCP_HTTP_HOST=0.0.0.0
                BLOG_MCP_HTTP_TOKEN=ci-smoke-not-a-real-token
                BLOG_MCP_CLONE_URL=https://github.com/The-Running-Dev/SubZeroDev.Blog.git
                BLOG_MCP_GIT_USER_NAME=ci-smoke
                BLOG_MCP_GIT_USER_EMAIL=ci-smoke@invalid.example
            # The deployment stack pulls the floating `latest` tag, so only
            # redeploy after a successful publish from main (container.yml
            # publishes only the default branch). A manual run redeploys only
            # when its `redeploy` input says so, which also records a manual
            # redeploy as a deliberate, forced act. `inputs` is empty on a
            # push event, hence the event_name arms.
            deploy: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.redeploy == true) }}
            # issue #109: the redeploy webhook only proves Portainer accepted
            # the request. The public /healthz must report this commit, and
            # then the post-deploy script re-checks it for several
            # consecutive samples and verifies the MCP tool catalog.
            health-url: https://blogging.subzerodev.com/healthz
            health-expect: ${{ github.sha }}
            post-deploy: build/Invoke-BlogMcpPostDeploy.ps1
        secrets:
            DEPLOY_WEBHOOK_URL: ${{ secrets.BLOG_MCP_REDEPLOY_WEBHOOK_URL }}
            # Fails closed (build/Invoke-BlogMcpPostDeploy.ps1 throws) if
            # BLOG_MCP_DEPLOY_VERIFY_TOKEN isn't configured, by design -- a
            # successful webhook call must never again be treated as proof of
            # a completed deployment.
            DEPLOY_TOKEN: ${{ secrets.BLOG_MCP_DEPLOY_VERIFY_TOKEN }}

    compose:
        name: Validate Compose files
        needs: changes
        if: needs.changes.outputs.blog_mcp_compose == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            # Default fetch-depth: 1 is correct here -- this job needs the
            # working tree, never git history.
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Record Compose version
              run: docker compose version

            # tools/blog-mcp/docker-compose.yml declares `env_file: - .env`,
            # and .env is git-ignored (it holds real credentials on a
            # developer machine), so it never exists on a runner. `docker
            # compose config` treats a missing env_file target as a hard
            # error, not a warning, so seed one from the checked-in
            # non-secret fixture. Doing it here rather than marking the
            # env_file `required: false` in the Compose file keeps
            # local-development behavior unchanged: a developer who forgets
            # to create .env still gets Compose's own clear error instead of
            # a container that starts and then fails on missing configuration.
            - name: Seed the local Compose env file from the CI fixture
              run: cp tools/blog-mcp/.env.ci tools/blog-mcp/.env

            # --profile http so the profiled second service is expanded too
            # -- `config` otherwise only resolves services in active
            # profiles, leaving half of each file unvalidated. Safe to print
            # the resolved config unquieted: every value in play comes from
            # the fixture file, never a real secret.
            # verification: true
            - name: Validate deployment Compose file
              run: >-
                  docker compose
                  --env-file tools/blog-mcp/.env.ci
                  --profile http
                  config

            # -f is explicit rather than relying on --project-directory alone
            # to also select the file: --project-directory sets the base
            # path that `build: context: .`, `env_file: .env`, and the
            # ./watch bind mount resolve against, but Compose's file
            # discovery still starts from the current directory.
            # verification: true
            - name: Validate local-development Compose file
              run: >-
                  docker compose
                  -f tools/blog-mcp/docker-compose.yml
                  --project-directory tools/blog-mcp
                  --env-file tools/blog-mcp/.env.ci
                  --profile http
                  config
